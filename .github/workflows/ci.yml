name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build Next.js Application
      run: npm run build
      env:
        # Provide strict dummy values for standard build requirements
        DATABASE_URL: "postgresql://test:test@localhost:5432/test"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dummy"
        CLERK_SECRET_KEY: "sk_test_dummy"
        UPLOADTHING_SECRET: "sk_live_dummy"
        UPLOADTHING_APP_ID: "dummy_app"
        LIVEKIT_API_KEY: "dummy_key"
        LIVEKIT_API_SECRET: "dummy_secret"
        NEXT_PUBLIC_LIVEKIT_URL: "wss://dummy.livekit.cloud"
        NEXT_TELEMETRY_DISABLED: 1

    - name: Lint Codebase
      run: npm run lint
